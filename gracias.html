.n-paint { animation: n-paint 1.2s ease-in-out infinite; } @keyframes n-paint { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }

.n-oink { animation: n-bob 1.2s ease-in-out infinite; }
